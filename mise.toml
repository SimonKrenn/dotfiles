"brew:ripgrep" = "latest"
"brew:btop" = "latest"
"brew:atuin" = "latest"
"brew:chafa" = "latest"
"brew:resvg" = "latest"
"brew:git-delta" = "latest"
"brew:git-filter-repo" = "latest"
"brew:lazydocker" = "latest"
"brew:sesh" = "latest"
"brew:gcc" = "latest"
"brew:erdtree" = "latest"
