# Experimental Apple Silicon macOS migration. See migration/README.md.
# This file is provisioning only; global runtime config stays separate.
[tools]
bun = "latest"
fnox = "latest"
go = "latest"
node = "22.15.0"
opencode = "latest"
rust = "latest"
"npm:tokscale" = "latest"
"npm:@openai/codex" = "latest"

