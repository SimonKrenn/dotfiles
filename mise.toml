"brew:libiconv" = "latest"
"brew:television" = "latest"
"brew:direnv" = "latest"
"brew:commitizen" = "latest"
"brew:bob" = "latest"
"brew:docker" = "latest"
"brew:fisher" = "latest"
"brew:gitmux" = "latest"
"brew:mole" = "latest"
"brew:wakatime-cli" = "latest"
"brew:trufflehog" = "latest"
"brew:jq" = "latest"
"brew:rtk" = "latest"
"brew:nixfmt" = "latest"
"brew:dmtrKovalenko/fff/fff-mcp" = "latest"
"brew:max-sixty/worktrunk/wt" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:raycast" = "latest"
